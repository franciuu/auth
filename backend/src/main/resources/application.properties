# ===================================================================
# Auth Service - default configuration
# Override any value via environment variables in production.
# ===================================================================

spring.application.name=auth
server.port=${SERVER_PORT:8080}

# --- Active profile -------------------------------------------------
# Use 'dev' for an in-memory H2 database (no MySQL needed):
#   SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# --- MySQL ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:authuser}
spring.datasource.password=${DB_PASSWORD:authpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Redis ----------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# --- JWT ------------------------------------------------------------
# IMPORTANT: override this secret in production (min 32 bytes / 256 bits).
app.jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-dev-only-256bit-secret-key!!}
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TTL:86400}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TTL:604800}

# --- Rate limiting (login) ------------------------------------------
app.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
app.rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:15}

# --- CORS -----------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://yourdomain.com}

# --- Email verification --------------------------------------------
# When true, unverified users cannot log in. Default false so the demo
# flow (register -> login) works without an SMTP server.
app.email.verification-required=${EMAIL_VERIFICATION_REQUIRED:false}
app.email.verification-ttl-hours=24
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# --- Cookies --------------------------------------------------------
# Secure cookies require HTTPS; set to false for plain-HTTP local dev.
app.cookie.secure=${COOKIE_SECURE:false}

# --- Seed admin account --------------------------------------------
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@test.com}
app.admin.password=${ADMIN_PASSWORD:AdminPass123!}

# --- Actuator / OpenAPI --------------------------------------------
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
