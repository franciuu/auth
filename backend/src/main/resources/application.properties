# ===================================================================
# Auth Service - configuration
# Defaults to an in-memory H2 database so the app runs with zero setup.
# To use MySQL instead, uncomment the MySQL block below.
# ===================================================================

spring.application.name=auth
server.port=${SERVER_PORT:8080}

# --- Database: in-memory H2 (default) -------------------------------
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- Database: MySQL (optional) -------------------------------------
# Comment out the H2 block above and uncomment these to use MySQL.
#spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=authuser
#spring.datasource.password=authpass
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- JWT ------------------------------------------------------------
# IMPORTANT: override this secret in production (min 32 bytes / 256 bits).
app.jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-dev-only-256bit-secret-key!!}
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TTL:86400}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TTL:604800}

# --- CORS -----------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://yourdomain.com}

# --- Cookies --------------------------------------------------------
# Secure cookies require HTTPS; keep false for plain-HTTP local dev.
app.cookie.secure=${COOKIE_SECURE:false}

# --- Seed admin account --------------------------------------------
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@test.com}
app.admin.password=${ADMIN_PASSWORD:AdminPass123!}

# --- Actuator / OpenAPI --------------------------------------------
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
