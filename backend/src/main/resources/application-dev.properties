# ===================================================================
# Dev profile: in-memory H2 instead of MySQL.
# Activate with SPRING_PROFILES_ACTIVE=dev
# NOTE: Redis is still required (rate limiting, blacklist, email tokens).
#       Run one locally, e.g.: docker run -p 6379:6379 redis:7
# ===================================================================

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Browse the dev database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
